syntax = "proto3";

package pigtree.session.v1;

option csharp_namespace = "PigTree.Session.V1";

message AuthHandshakeRequest {
  bytes bootstrap_nonce = 1;
  bytes client_nonce = 2;
  uint32 client_pid = 3;
  uint32 client_session_id = 4;
}

message AuthHandshakeResponse {
  uint32 status = 1;
  bytes server_nonce = 2;
  uint32 server_pid = 3;
  bytes channel_key_hash = 4;
  string error_message = 5;
}

message PingRequest {
  uint64 timestamp_utc_ms = 1;
  uint32 delay_ms = 2;
}

message PingResponse {
  uint64 timestamp_utc_ms = 1;
  uint64 echo_timestamp_utc_ms = 2;
}

message EchoRequest {
  string payload = 1;
  uint32 delay_ms = 2;
}

message EchoResponse {
  string payload = 1;
}

message HealthRequest {
  bool include_memory = 1;
  uint32 delay_ms = 2;
}

message HealthResponse {
  string status = 1;
  uint64 uptime_ms = 2;
  uint64 memory_private_bytes = 3;
  uint32 handle_count = 4;
}

message StatusRequest {
  uint32 delay_ms = 1;
}

message StatusResponse {
  string state = 1;
  uint32 active_runs = 2;
  uint64 total_observations = 3;
  string session_id = 4;
}

message VersionRequest {
  uint32 delay_ms = 1;
}

message VersionResponse {
  string engine_version = 1;
  uint32 protocol_version = 2;
  string build_date = 3;
  string commit_hash = 4;
  repeated string capabilities = 5;
}

message ShutdownRequest {}

message ShutdownResponse {
  uint32 status = 1;
}

message CancelRequest {
  string target_request_id = 1;
  string reason = 2;
}

message CancelResponse {
  bool cancelled = 1;
  string message = 2;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  string details = 3;
}

enum ScanRunOutcome {
  SCAN_RUN_OUTCOME_UNSPECIFIED = 0;
  SCAN_RUN_OUTCOME_FINISHED = 1;
  SCAN_RUN_OUTCOME_CANCELLED = 2;
  SCAN_RUN_OUTCOME_FAILED = 3;
}

enum ScopeCoverage {
  SCOPE_COVERAGE_UNSPECIFIED = 0;
  SCOPE_COVERAGE_COMPLETE = 1;
  SCOPE_COVERAGE_PARTIAL = 2;
  SCOPE_COVERAGE_INDETERMINATE = 3;
}

enum ExternalReferenceStatusProto {
  EXTERNAL_REFERENCE_STATUS_UNSPECIFIED = 0;
  EXTERNAL_REFERENCE_STATUS_CONFIRMED_NONE = 1;
  EXTERNAL_REFERENCE_STATUS_CONFIRMED_EXTERNAL = 2;
  EXTERNAL_REFERENCE_STATUS_INDETERMINATE = 3;
  EXTERNAL_REFERENCE_STATUS_INCONSISTENT_EVIDENCE = 4;
  EXTERNAL_REFERENCE_STATUS_NOT_APPLICABLE = 5;
}

enum LinkCountKnowledgeStatus {
  LINK_COUNT_KNOWLEDGE_STATUS_UNSPECIFIED = 0;
  LINK_COUNT_KNOWLEDGE_STATUS_KNOWN = 1;
  LINK_COUNT_KNOWLEDGE_STATUS_NOT_OBSERVED = 2;
  LINK_COUNT_KNOWLEDGE_STATUS_UNAVAILABLE = 3;
  LINK_COUNT_KNOWLEDGE_STATUS_NOT_APPLICABLE = 4;
}

message LinkCountKnowledgeProto {
  LinkCountKnowledgeStatus status = 1;
  uint32 count = 2;
}

message CoverageGapReport {
  string display_path = 1;
  string status_code = 2;
  uint32 native_error = 3;
  string error_message = 4;
}

message ScanRequest {
  string operation_id = 1;
  string target_path = 2;
}

message ScanProgress {
  string operation_id = 1;
  uint64 sequence_number = 2;
  string timestamp_iso = 3;
  uint64 observed_directories = 4;
  uint64 observed_files = 5;
  uint64 observed_logical_bytes = 6;
  uint64 observed_referenced_allocated_bytes = 7;
  uint32 coverage_gaps = 8;
  string current_phase = 9;
  string current_directory = 10;
}

// Canonical per-entry projection over the settled graph. Field names follow the
// canonical vocabulary in issue #20 and CONTEXT.md; numbers 5 and 6 were renamed
// in place (logical_size -> logical_bytes, allocated_size -> referenced_allocated_bytes).
message DirectoryEntryNode {
  uint32 id = 1;
  uint32 parent_id = 2;
  string name = 3;
  uint32 entry_kind = 4;
  uint64 logical_bytes = 5;
  uint64 referenced_allocated_bytes = 6;
  bool allocated_size_known = 7;
  uint32 child_count = 8;
  bool has_children = 9;
  uint64 unique_allocated_bytes = 11;
  uint32 observed_alias_count = 13;
  LinkCountKnowledgeProto total_link_count = 14;
  ExternalReferenceStatusProto external_reference_status = 15;
  uint64 known_subtotal_allocated_bytes = 16;
}

message GetChildrenRequest {
  string operation_id = 1;
  uint32 parent_id = 2;
  uint32 offset = 3;
  uint32 limit = 4;
}

message GetChildrenResponse {
  string operation_id = 1;
  uint32 parent_id = 2;
  uint32 total_children = 3;
  uint32 offset = 4;
  repeated DirectoryEntryNode nodes = 5;
}

message ScanResponse {
  string operation_id = 1;
  string target_path = 2;
  ScanRunOutcome run_outcome = 3;
  string observation_started_iso = 4;
  string observation_completed_iso = 5;
  ScopeCoverage scope_coverage = 6;
  uint64 directory_count = 7;
  uint64 file_count = 8;
  uint64 special_count = 9;
  uint64 logical_bytes = 10;
  uint64 allocated_bytes = 11;
  bool allocated_bytes_known = 12;
  repeated CoverageGapReport coverage_gaps = 13;
  uint64 duration_ms = 14;
  uint64 referenced_allocated_bytes = 15;
  uint64 unique_allocated_bytes = 16;
  uint64 known_subtotal_allocated_bytes = 17;
  uint64 indeterminate_external_reference_objects = 18;
}

message CommandRequest {
  string request_id = 1;
  oneof request {
    AuthHandshakeRequest auth_handshake = 2;
    PingRequest ping = 3;
    EchoRequest echo = 4;
    HealthRequest health = 5;
    StatusRequest status = 6;
    VersionRequest version = 7;
    ShutdownRequest shutdown = 8;
    CancelRequest cancel = 9;
    ScanRequest scan = 10;
    GetChildrenRequest get_children = 11;
  }
}

message CommandResponse {
  string request_id = 1;
  uint32 status = 2;
  string error_code = 3;
  string error_message = 4;
  oneof response {
    AuthHandshakeResponse auth_handshake = 5;
    PingResponse ping = 6;
    EchoResponse echo = 7;
    HealthResponse health = 8;
    StatusResponse status_payload = 9;
    VersionResponse version = 10;
    ShutdownResponse shutdown = 11;
    CancelResponse cancel = 12;
    ErrorResponse error = 13;
    ScanProgress scan_progress = 14;
    ScanResponse scan_response = 15;
    GetChildrenResponse get_children = 16;
  }
}
